name: Update

# 毎日の起動は Cloudflare Worker（tools/cron/）が workflow_dispatch を叩く。
# 毎日 06:20 JST（前日 21:20 UTC）。GitHub の schedule は発火しない日があるので使わない
# （予定4回のうち走ったのは1回だけ、それも2時間半遅れ。分をずらしても改善しなかった）。
# 見た目やスクリプトを変えたときは、Actions の画面から手で実行する。
on:
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # shell: bash を明示すると pipefail が付く。| tee で失敗を握りつぶさないように
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      # 前日比（順位の上げ下げ）に前回の CSV が要る。git にもファイルにも残さず、
      # Actions のキャッシュにだけ置く。無ければその日は前日比なしで出す。
      - name: 前回の推計を復元
        uses: actions/cache/restore@v6
        with:
          path: history
          key: history-${{ github.run_id }}
          restore-keys: history-

      # 各ステップの出力は logs/run.log にも残す。notify.py が ::warning:: と失敗の理由を拾う
      - name: 推計を計算
        run: |
          mkdir -p logs
          python tools/build.py --out-dir history 2>&1 | tee -a logs/run.log

      # 前日比は株価の日付が変わった直近の CSV と比べる。週末や連休をまたげるだけ残す
      - name: 古い推計を捨てる
        working-directory: history
        run: |
          shopt -s nullglob
          ls ????-??-??.csv | sort | head -n -7 | while read -r csv; do
            rm "$csv" "${csv%.csv}.meta.json"
          done
          ls

      # nav.py は基準価額の推計を history/nav-estimates.json に残し、翌日以降に答え合わせする。
      # キャッシュに入れるため、保存より前に動かす
      - name: 基準価額を取得
        run: python tools/nav.py --out _site/nav.json --history history 2>&1 | tee -a logs/run.log

      - name: 推計をキャッシュに保存
        uses: actions/cache/save@v6
        with:
          path: history
          key: history-${{ github.run_id }}

      - name: ページを生成
        run: |
          mkdir -p _site
          python tools/render.py --history history --nav _site/nav.json \
            --page _site/index.html --rows _site/rows 2>&1 | tee -a logs/run.log
          cp -R logos _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # 答え合わせの結果を Slack に送る。途中で失敗した日も、失敗したことを送る
      - name: Slack に通知
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python tools/notify.py --history history --nav _site/nav.json --log logs/run.log

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
