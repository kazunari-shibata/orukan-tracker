<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オルカンの構成銘柄一覧</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    /* ライト固定。OS がダークでもスクロールバー等を明るく保つ */
    color-scheme:light;
    --bg:#f2f4f7; --panel:#fbfcfe; --line:#dfe3ea;
    --text:#1f2733; --dim:#666f7b; --sub:#434b57; --accent:#2563a8;
    --up:#0f7b55; --down:#c0392b;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1180px; margin:0 auto; padding:40px 20px 32px; }

  .nav {
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px 10px; margin-bottom:18px;
  }
  .navhead { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between; }
  /* 枠の中の補足文字は --dim だと薄いので、本文色を和らげた --sub を使う */
  .fundname { color:var(--sub); font-size:.85rem; }
  .navnow { font-variant-numeric:tabular-nums; line-height:1.2; margin-top:2px; }
  .navnow b { font-size:1.6rem; font-weight:650; letter-spacing:-0.01em; }
  .navunit { color:var(--sub); font-size:.85rem; margin-left:2px; }
  .chglabel { color:var(--sub); font-size:.82rem; margin-left:12px; }
  .navnow .navchg { font-size:.95rem; margin-left:5px; font-weight:600; }
  /* 右側は期間ボタンと、その期間の騰落率（ボタンの下に右寄せ） */
  .navside { display:flex; flex-direction:column; align-items:flex-end; gap:6px; align-self:flex-start; }
  .rangeperf { font-variant-numeric:tabular-nums; line-height:1.2; }
  .rangeperf .chglabel { margin-left:0; }
  .rangeperf #rangechg { font-size:.95rem; margin-left:5px; font-weight:600; }
  .ranges { display:flex; gap:4px; }
  .ranges button {
    font:inherit; font-size:.8rem; color:var(--sub); cursor:pointer;
    background:none; border:1px solid var(--line); border-radius:6px; padding:4px 9px;
  }
  .ranges button[aria-pressed="true"] { color:var(--panel); background:var(--accent); border-color:var(--accent); }
  .chartwrap { position:relative; margin-top:10px; }
  #chart { display:block; width:100%; height:132px; overflow:visible; }
  .readout {
    position:absolute; top:0; transform:translateX(-50%);
    background:var(--text); color:var(--panel); font-size:.72rem;
    padding:3px 7px; border-radius:5px; white-space:nowrap; pointer-events:none;
  }
  /* ホバーできない端末（スマホ）で、title をタップして出す吹き出し。見た目は .readout に揃える */
  .tip {
    position:fixed; z-index:10; max-width:min(320px, calc(100vw - 16px));
    background:var(--text); color:var(--panel); font-size:.78rem; line-height:1.4;
    padding:5px 9px; border-radius:6px; pointer-events:none;
  }
  /* 列幅は中身なりに決めたうえで、余った幅を各列に配分する（table-layout:auto）。
     nowrap なので中身より狭くはならず、狭い画面では overflow-x で横に流れる。 */
  .tablewrap {
    overflow-x:auto; border:1px solid var(--line); border-radius:12px;
    background:var(--panel);
  }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:10px 12px; text-align:left; white-space:nowrap; }
  th {
    background:var(--panel);
    font-size:.72rem; font-weight:600; letter-spacing:.04em; color:var(--dim);
    border-bottom:1px solid var(--line);
  }
  td { border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  /* 並べ替えのボタン。見た目は見出しの文字のまま。並べている列だけ色と ▲▼ を付ける */
  th button {
    font:inherit; letter-spacing:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer;
  }
  th button:hover { color:var(--text); }
  th[aria-sort] button { color:var(--accent); }
  th[aria-sort="ascending"] button::after { content:" ▲"; }
  th[aria-sort="descending"] button::after { content:" ▼"; }
  tbody tr:last-child td { border-bottom:0; }
  /* 行を追いやすいよう、1行おきにごく薄く色を付ける */
  tbody tr:nth-child(even) { background:color-mix(in srgb, var(--line) 30%, transparent); }
  .num-rank { color:var(--dim); }
  .rankdelta { font-size:.68rem; margin-left:5px; font-variant-numeric:tabular-nums; }
  .rankdelta.new { color:var(--accent); font-weight:600; }
  /* 企業名の列は余った幅を使い、表が収まらないときはここを削って … で詰める
     （横スクロールを出さない）。max-width:0 と width:100% で、他の列は中身の幅に保つ。 */
  th.co, td.co { width:100%; max-width:0; min-width:6em; padding-left:0; }
  .co .nm {
    display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis;
    font-weight:600; vertical-align:middle;
  }
  /* ロゴは自前配信。取得できていない銘柄は頭文字のバッジにフォールバックする
     （img の onerror で中身を消すと ::after の頭文字が見える） */
  /* ロゴの列は横スクロールしても左端に残す（右の列を見ているときも、どの行の会社か分かるように）。
     下の列が透けないよう、背景は行の縞と同じ色を不透明で塗る */
  /* ロゴと企業名の間隔はロゴの列の右の余白で取る（横スクロールしたとき、隣の列がロゴに接して見えないように） */
  th.lg, td.lg { position:sticky; left:0; z-index:1; padding-right:9px; background:var(--panel); }
  tbody tr:nth-child(even) td.lg { background:color-mix(in srgb, var(--line) 30%, var(--panel)); }
  .logo {
    position:relative; display:inline-block; width:22px; height:22px;
    vertical-align:middle; border-radius:4px; overflow:hidden;
    background:hsl(var(--seed) 26% 93%);
  }
  .logo::after {
    content:attr(data-letter); position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.68rem; font-weight:700; color:hsl(var(--seed) 45% 38%);
  }
  .logo img { position:relative; width:100%; height:100%; object-fit:contain; }
  /* ::after は子要素より後に描かれるので、画像が載っている行では明示的に消す。
     ロゴが読めた行は下地の着色タイルも不要。 */
  .logo:has(img) { background:none; }
  .logo:has(img)::after { display:none; }
  /* 国旗＋国・地域名 */
  .ccy { color:var(--dim); font-size:.72rem; margin-left:3px; }
  .sectorcell { color:var(--dim); }
  .cname { margin-left:6px; }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--dim); }


  /* 見出し行の固定。表は横スクロールの枠に入っていて position:sticky がページに効かないので、
     見出し行の複製を画面上端に置き、JS が列幅と横スクロール位置を元の表に合わせる */
  .stickyhead {
    position:fixed; top:0; z-index:4; overflow:hidden; background:var(--panel);
    border-bottom:1px solid var(--line); box-shadow:0 2px 8px rgb(0 0 0 / .05);
  }
  .stickyhead table { table-layout:fixed; }
  .stickyhead th { border-bottom:0; }
  /* 100銘柄ずつのページ送り。JS が中身を作る */
  .pager {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
    margin-top:16px; font-size:.8rem; font-variant-numeric:tabular-nums;
  }
  .pager:empty { display:none; }
  .pager a, .pager span { min-width:2.1em; padding:5px 8px; border-radius:6px; text-align:center; }
  .pager a {
    color:var(--text); text-decoration:none; background:var(--panel); border:1px solid var(--line);
  }
  .pager a:hover { border-color:var(--accent); }
  .pager a[aria-current="page"] { color:var(--panel); background:var(--accent); border-color:var(--accent); }
  .pager .gap { color:var(--dim); min-width:auto; padding:5px 2px; }
  .secttl { font-size:1rem; font-weight:650; margin-top:24px; margin-bottom:12px; }
  /* ページの先頭はすでに .wrap の余白があるので、最初の見出しの上は空けない */
  .wrap > .secttl:first-child { margin-top:0; }
  /* 数字がいつの値か・どう推計したか。基準価額の枠のすぐ下に置く */
  .asof { color:var(--dim); font-size:.75rem; margin-top:-10px; }
  .copyright { margin-top:72px; color:var(--dim); font-size:.72rem; text-align:center; }

  /* タブレット・スマホは列が多く収まりきらないので、企業名を削らず最大幅で止め、
     はみ出る分は .tablewrap の横スクロールにする */
  @media (max-width:1024px) {
    th.co, td.co { width:auto; max-width:none; min-width:0; }
    .co .nm { max-width:20em; }
  }

  @media (max-width:720px) {
    .wrap { padding:28px 12px 24px; }
    /* 列は省略しない。表は .tablewrap の overflow-x でそのまま横に流す */
    th, td { padding:9px 8px; font-size:.85rem; }
    .co .nm { max-width:13em; }   /* スマホは画面が狭いので、タブレットより詰める */
    .nav { padding:14px 14px 8px; }
    /* 騰落率が同じ行に収まらない幅では、まとまりごと次の行に送る */
    .navside { flex-direction:row; flex-wrap:wrap; align-items:center; width:100%; }
    .ranges { flex-wrap:wrap; }
    .ranges button, .rangeperf { white-space:nowrap; }
    .rangeperf { margin-left:auto; }
  }
</style>
</head>
<body data-generated="">
<div class="wrap">
  <h2 class="secttl">基準価額</h2>

  <section class="nav" id="nav">
    <div class="navhead">
      <div><!--ssg:navhead--><!--/ssg:navhead--></div>
      <div class="navside">
        <div class="ranges" id="ranges"></div>
        <div class="rangeperf"><span class="chglabel" id="rangelabel"></span><span id="rangechg"></span></div>
      </div>
    </div>
    <div class="chartwrap"><svg id="chart" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="readout" id="readout" hidden></div>
    </div>
  </section>
  <p class="asof"><!--ssg:asof--><!--/ssg:asof--></p>

  <h2 class="secttl" id="holdings">構成銘柄<!--ssg:scope--><!--/ssg:scope--></h2>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <!-- data-sort の付いた列は見出しを押すと並べ替える。num は大きい順、text は名前の順から始める。
               株価は通貨がばらばらで比べられないので並べ替えない -->
          <th class="num-rank"><button type="button" data-sort="num" data-first="asc">順位</button></th>
          <th class="lg"></th>
          <th class="co"><button type="button" data-sort="text">企業名</button></th>
          <th><button type="button" data-sort="num">組入比率</button></th>
          <th><button type="button" data-sort="num">時価総額</button></th>
          <th>株価</th>
          <th><button type="button" data-sort="num">前日比</button></th>
          <th class="sectorcell"><button type="button" data-sort="text">業種</button></th>
          <th class="flagcell"><button type="button" data-sort="text">国・地域</button></th>
        </tr>
      </thead>
      <tbody id="tb"><!--ssg:rows--><!--/ssg:rows--></tbody>
    </table>
  </div>
  <div class="stickyhead" id="stickyhead" aria-hidden="true" hidden><table></table></div>
  <nav class="pager" id="pager" aria-label="ページ" data-pages="1"></nav>

  <footer class="copyright">© <span id="year">2026</span> Kazunari Shibata</footer>
</div>

<script>
// これは index.html のひな形。表・更新日時・基準価額の数字は、Pages のビルドで
// tools/render.py が書き込んで index.html にする（Actions で生成して GitHub Pages に出す）。
// ここで描くのはチャート（nav.json）とページ送りだけ。
// 日付は YYYY/M/D で統一する
const fmtDate = v => {
  const d = v instanceof Date ? v : new Date(`${v}T00:00:00`);
  return isNaN(d) ? v : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
};

const RANGES = [['1か月', 21], ['6か月', 126], ['1年', 252], ['全期間', Infinity]];
let NAV = null, navView = null, navRange = 252;   // 初期表示は1年

// 公表値の推移の後ろに推計値を1点足す（日付は null。読み取り欄に「推計」と出す）
function navSeries() {
  const est = NAV.estimate;
  return est ? { values: [...NAV.values, est.value], dates: [...NAV.dates, null] }
             : { values: NAV.values, dates: NAV.dates };
}

function drawNav() {
  const s = navSeries();
  const n = Math.min(s.values.length, navRange);
  const vals = s.values.slice(-n), dates = s.dates.slice(-n);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const W = 1000, H = 132, pad = 6;
  const x = i => (i / (vals.length - 1)) * W;
  const y = v => H - pad - ((v - lo) / span) * (H - pad * 2);
  const path = a => a.map((v, i) => v == null ? '' :
    ((i && a[i - 1] != null) ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ').trim();

  const line = path(vals);
  const color = vals.at(-1) >= vals[0] ? 'var(--up)' : 'var(--down)';
  document.getElementById('chart').innerHTML = `
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${line} L ${W} ${H} L 0 ${H} Z" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"
          vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <line id="cursor" y1="0" y2="${H}" stroke="var(--dim)" stroke-width="1"
          vector-effect="non-scaling-stroke" opacity="0"/>`;
  document.getElementById('chart').setAttribute('viewBox', `0 0 ${W} ${H}`);

  const r = (vals.at(-1) / vals[0] - 1) * 100;
  const label = RANGES.find(([, k]) => k === navRange)?.[0] ?? '';
  document.getElementById('rangelabel').textContent = label === '全期間' ? '設定来' : label;
  const rc = document.getElementById('rangechg');
  rc.textContent = `${r > 0 ? '+' : ''}${r.toFixed(1)}%`;
  rc.className = r > 0 ? 'up' : r < 0 ? 'down' : 'flat';
  return { vals, dates, x, W };
}

function bootNav(d) {
  NAV = d;

  document.getElementById('ranges').innerHTML = RANGES
    .map(([label, n]) => `<button data-n="${n}" aria-pressed="${n === navRange}">${label}</button>`).join('');
  document.querySelectorAll('#ranges button').forEach(b => b.addEventListener('click', () => {
    navRange = Number(b.dataset.n);
    document.querySelectorAll('#ranges button')
      .forEach(o => o.setAttribute('aria-pressed', o === b));
    navView = drawNav();
  }));

  navView = drawNav();
  const svg = document.getElementById('chart'), out = document.getElementById('readout');
  svg.addEventListener('pointermove', e => {
    const r = svg.getBoundingClientRect();
    const view = navView;
    const i = Math.round(((e.clientX - r.left) / r.width) * (view.vals.length - 1));
    const v = view.vals[i]; if (v == null) return;
    svg.querySelector('#cursor').setAttribute('opacity', '1');
    svg.querySelector('#cursor').setAttribute('x1', view.x(i));
    svg.querySelector('#cursor').setAttribute('x2', view.x(i));
    out.hidden = false;
    out.style.left = `${(i / (view.vals.length - 1)) * 100}%`;
    out.textContent = `${view.dates[i] ? fmtDate(view.dates[i]) : '推計'}  ${v.toLocaleString('ja-JP')}円`;
  });
  svg.addEventListener('pointerleave', () => {
    out.hidden = true; svg.querySelector('#cursor').setAttribute('opacity', '0');
  });
}

document.getElementById('year').textContent = new Date().getFullYear();

// 100銘柄ずつのページ送り。1ページ目は HTML に書き込み済みで、2ページ目以降は
// tools/render.py が書き出した rows/<ページ>.json を読み込む。
// 状態は URL の #page=N で持つ（戻る・リンクでも開ける）。
const pager = document.getElementById('pager');
const pages = Number(pager.dataset.pages) || 1;
const pageRows = { 1: { rows: document.getElementById('tb').innerHTML } };
let currentPage = 1;

const pageFromHash = () => {
  const params = new URLSearchParams(location.hash.slice(1));
  const page = Number(params.get('page'));
  return Number.isInteger(page) ? Math.min(Math.max(page, 1), pages) : 1;
};

function drawPager() {
  const page = currentPage;
  let html = '';
  if (pages > 1) {
    // 先頭・末尾と、今のページの前後だけ番号を出す（間は … で詰める）
    const nums = [...new Set([1, page - 1, page, page + 1, pages])]
      .filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
    const link = (n, label, attrs = '') => `<a href="#page=${n}" ${attrs}>${label}</a>`;
    if (page > 1) html += link(page - 1, '前へ', 'rel="prev"');
    nums.forEach((n, i) => {
      if (i && n - nums[i - 1] > 1) html += '<span class="gap">…</span>';
      html += link(n, n, n === page ? 'aria-current="page"' : '');
    });
    if (page < pages) html += link(page + 1, '次へ', 'rel="next"');
  }
  pager.innerHTML = html;
}

async function showPage(page, scroll) {
  if (!pageRows[page]) {
    try {
      const r = await fetch(`rows/${page}.json?v=${encodeURIComponent(GENERATED)}`);
      if (!r.ok) throw new Error(r.status);
      pageRows[page] = await r.json();
    } catch {
      return;   // 読めなければ今のページのまま
    }
  }
  currentPage = page;
  document.getElementById('tb').innerHTML = pageRows[page].rows;
  sortRows();
  drawPager();
  syncStickyHead();
  if (scroll) document.getElementById('holdings').scrollIntoView();
}

window.addEventListener('hashchange', () => {
  const next = pageFromHash();
  if (next !== currentPage) showPage(next, true);
});

// 表の見出し行を画面上端に固定する（.stickyhead の CSS の説明を参照）
const tableWrap = document.querySelector('.tablewrap');
const stickyHead = document.getElementById('stickyhead');
const stickyTable = stickyHead.querySelector('table');
const copyHead = () => { stickyTable.innerHTML = tableWrap.querySelector('thead').outerHTML; };
copyHead();
function syncStickyHead() {
  const box = tableWrap.getBoundingClientRect();
  const thead = tableWrap.querySelector('thead');
  const show = box.top < 0 && box.bottom > thead.getBoundingClientRect().height * 2;
  stickyHead.hidden = !show;
  if (!show) return;
  stickyHead.style.left = `${box.left + tableWrap.clientLeft}px`;
  stickyHead.style.width = `${tableWrap.clientWidth}px`;
  const src = thead.querySelectorAll('th');
  stickyTable.querySelectorAll('th').forEach((th, i) => {
    th.style.width = th.style.minWidth = th.style.maxWidth = `${src[i].getBoundingClientRect().width}px`;
  });
  stickyTable.style.width = `${tableWrap.querySelector('table').getBoundingClientRect().width}px`;
  stickyTable.style.transform = `translateX(${-tableWrap.scrollLeft}px)`;
}
let stickyFrame = 0;
const queueStickyHead = () => {
  if (!stickyFrame) stickyFrame = requestAnimationFrame(() => { stickyFrame = 0; syncStickyHead(); });
};
window.addEventListener('scroll', queueStickyHead, { passive: true });
window.addEventListener('resize', queueStickyHead);
tableWrap.addEventListener('scroll', queueStickyHead, { passive: true });

// 見出しを押すと、表示中のページの行を並べ替える。もう一度押すと逆順。順位の見出しで元の並びに戻る。
// 値は render.py がセルの data-v に入れた元の値（表示の「4.98兆ドル」などではなく数値）。
// 値の無いセル（—）は向きに関係なく下に寄せ、同じ値どうしは順位の順にする。
let sortCol = null, sortDir = null;
function sortRows() {
  if (sortCol == null) return;
  const tb = document.getElementById('tb');
  const th = tableWrap.querySelectorAll('thead th')[sortCol];
  const text = th.querySelector('button').dataset.sort === 'text';
  const sign = sortDir === 'asc' ? 1 : -1;
  const val = tr => tr.cells[sortCol].dataset.v ?? '';
  const rank = tr => Number(tr.cells[0].dataset.v);
  const rows = [...tb.rows].sort((a, b) => {
    const va = val(a), vb = val(b);
    if ((va === '') !== (vb === '')) return va === '' ? 1 : -1;
    const c = va === '' ? 0 : text ? va.localeCompare(vb, 'ja') : Number(va) - Number(vb);
    return c * sign || rank(a) - rank(b);
  });
  tb.append(...rows);
}
function setSort(col) {
  const btn = tableWrap.querySelectorAll('thead th')[col].querySelector('button');
  const first = btn.dataset.first || (btn.dataset.sort === 'text' ? 'asc' : 'desc');
  sortDir = col === sortCol ? (sortDir === 'asc' ? 'desc' : 'asc') : first;
  sortCol = col;
  tableWrap.querySelectorAll('thead th').forEach((th, i) => {
    if (i === col) th.setAttribute('aria-sort', sortDir === 'asc' ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
  sortRows();
  copyHead();
  syncStickyHead();
}
// 固定表示の見出し（複製）も押せるように、列の位置で元の見出しに読み替える
[tableWrap, stickyHead].forEach(el => el.addEventListener('click', e => {
  const btn = e.target.closest('th button');
  if (btn) setSort([...btn.closest('tr').children].indexOf(btn.closest('th')));
}));

// ホバーできない端末（スマホ）では、title の付いた箇所（構成銘柄のロゴと企業名）をタップすると吹き出しで出す。
// リンクやボタンは押したときの動作を優先する。
if (matchMedia('(hover: none)').matches) {
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.hidden = true;
  tip.setAttribute('role', 'tooltip');
  document.body.append(tip);
  let tipFor = null;
  const hideTip = () => { tip.hidden = true; tipFor = null; };
  document.addEventListener('click', e => {
    const el = e.target.closest('[title]');
    // 同じ箇所をもう一度タップしたら閉じる
    if (!el || !el.title || el === tipFor || e.target.closest('a, button')) { hideTip(); return; }
    tip.textContent = el.title;
    tip.hidden = false;
    // 上に出す。画面の上端にかかるなら下に出す。どちらも画面からはみ出さないように寄せる
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const fit = (v, max) => Math.max(8, Math.min(v, max - 8));
    tip.style.left = fit(r.left + r.width / 2 - w / 2, innerWidth - w) + 'px';
    tip.style.top = fit(r.top - h - 6 >= 8 ? r.top - h - 6 : r.bottom + 6, innerHeight - h) + 'px';
    tipFor = el;
  });
  // 表の横スクロールも拾えるように capture で
  addEventListener('scroll', hideTip, { passive: true, capture: true });
  addEventListener('resize', hideTip);
}

// 生成物のバージョン。nav.json と rows/ もこれで引くので、更新がない限りキャッシュが効く。
const GENERATED = document.body.dataset.generated || '';
drawPager();
{
  const first = pageFromHash();
  if (first !== 1) showPage(first, false);
}
fetch('nav.json?v=' + encodeURIComponent(GENERATED))
  .then(r => r.json()).then(bootNav).catch(() => {});
// 生成は1日1回。開きっぱなしのタブ向けに1時間ごとに確かめ、新しくなっていれば読み直す。
// 中身は読まず、毎回作り直される1ページ目の行データの ETag / Last-Modified の変化だけ見る。
const dataStamp = () => fetch('rows/1.json', { method: 'HEAD', cache: 'no-store' })
  .then(r => r.ok ? (r.headers.get('etag') || r.headers.get('last-modified')) : null)
  .catch(() => null);
dataStamp().then(first => {
  if (!first) return;
  setInterval(() => {
    dataStamp().then(now => { if (now && now !== first) location.reload(); });
  }, 60 * 60 * 1000);
});
</script>
